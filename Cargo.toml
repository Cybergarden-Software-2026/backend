[workspace]
resolver = "3"
members = ["crates/*"]
# `cargo test` / `cargo build` без --workspace охватывают все crates.
default-members = [".", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
dashboard-config = { path = "crates/config" }
dashboard-domain = { path = "crates/domain" }
dashboard-store = { path = "crates/store" }
dashboard-api = { path = "crates/api" }
dashboard-importer = { path = "crates/importer" }
dashboard-ai = { path = "crates/ai" }

anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9.1", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "migrate",
] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4"] }
http-body-util = "0.1.5"
sha2 = "0.10"
hex = "0.4"

# Корневой пакет: бинарники-процессы (как процессы Python-версии).
[package]
name = "dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "api"
path = "bin/api.rs"

[[bin]]
name = "migrate"
path = "bin/migrate.rs"

[[bin]]
name = "importer"
path = "bin/importer.rs"

[[bin]]
name = "ai-worker"
path = "bin/ai_worker.rs"

[dependencies]
dashboard-config.workspace = true
dashboard-store.workspace = true
dashboard-api.workspace = true
dashboard-importer.workspace = true
dashboard-ai.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

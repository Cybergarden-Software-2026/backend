name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Tests and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-postgres
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate Compose
        run: |
          cp .env.example .env
          UNDERCTRL_BACKEND_IMAGE=backend-runtime:ci docker compose \
            -f docker-compose.yml -f compose.vserver.yml -f deploy/compose.image.yml \
            config --quiet

      - name: Build test image
        run: docker build --target test -t backend-test:ci .

      - name: Test workspace with PostgreSQL
        env:
          TEST_NETWORK: ${{ job.services.postgres.network }}
          TEST_DATABASE_URL: postgresql://postgres:ci-postgres@postgres:5432/postgres
        run: docker run --rm --network "$TEST_NETWORK" --env TEST_DATABASE_URL backend-test:ci

      - name: Build runtime image
        run: docker build --target runtime -t backend-runtime:ci .

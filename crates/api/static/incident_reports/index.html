<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f7">
  <title>Сообщить об инциденте · underCtrl</title>
  <link rel="stylesheet" href="/api/v1/incident-reports/form.css">
  <script src="/api/v1/incident-reports/form.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="masthead">
      <span class="brand">
        <svg aria-hidden="true" width="32" height="32" viewBox="0 0 40 40">
          <rect x="1" y="1" width="38" height="38" rx="12" fill="#fe0032"/>
          <path d="M7 20h6l3-7 5 14 4-9 2 2h6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        underCtrl
      </span>
      <span class="product">Формы</span>
    </div>
  </header>

  <main>
    <section class="sheet" id="entry" aria-labelledby="form-title">
      <div class="sheet-heading">
        <h1 id="form-title">Сообщить об инциденте</h1>
        <p>Все поля обязательны.</p>
      </div>
      <form id="incident" action="/api/v1/incident-reports" method="post">
        <div class="fields">
          <div class="field">
            <label for="title">Заголовок инцидента</label>
            <input id="title" name="title" type="text" maxlength="160" required placeholder="Например, не открывается личный кабинет">
          </div>
          <div class="field">
            <label for="description">Описание</label>
            <textarea id="description" name="description" rows="3" maxlength="5000" required placeholder="Что произошло, когда это началось и кого затронуло?"></textarea>
          </div>
          <div class="field">
            <label for="service">Затронутый сервис</label>
            <input id="service" name="service" type="text" maxlength="160" required placeholder="Название сервиса или системы">
          </div>
          <fieldset class="priority-group">
            <legend>Приоритет</legend>
            <div class="priority-options">
              <label class="choice"><input type="radio" name="priority" value="P1" required><span><strong>P1</strong><small>Критический</small></span></label>
              <label class="choice"><input type="radio" name="priority" value="P2" required><span><strong>P2</strong><small>Высокий</small></span></label>
              <label class="choice"><input type="radio" name="priority" value="P3" required><span><strong>P3</strong><small>Средний</small></span></label>
              <label class="choice"><input type="radio" name="priority" value="P4" required><span><strong>P4</strong><small>Низкий</small></span></label>
            </div>
          </fieldset>
        </div>
        <div class="actions">
          <noscript><p class="problem">Включите JavaScript в браузере, чтобы отправить форму.</p></noscript>
          <p class="problem" id="error" role="alert" hidden></p>
          <button class="primary" id="submit" type="submit" disabled>Отправить</button>
        </div>
      </form>
    </section>
    <section class="sheet receipt" id="receipt" aria-labelledby="receipt-title" hidden>
      <div class="receipt-mark" aria-hidden="true">✓</div>
      <h1 id="receipt-title" tabindex="-1">Заявка принята</h1>
      <p id="receipt-number"></p>
      <button class="primary" id="again" type="button">Сообщить ещё об одном инциденте</button>
    </section>
  </main>
</body>
</html>
